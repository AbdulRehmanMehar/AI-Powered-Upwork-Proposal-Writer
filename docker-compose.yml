version: '3.8'

services:
  # ===========================================
  # Next.js Application
  # ===========================================
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: upwork-proposal-writer
    restart: unless-stopped
    ports:
      - "${APP_PORT:-3000}:3000"
    environment:
      - NODE_ENV=production
      # Database
      - DATABASE_URL=${DATABASE_URL}
      # Auth
      - AUTH_SECRET=${AUTH_SECRET}
      - AUTH_URL=${AUTH_URL:-http://localhost:3000}
      # AI/LLM — local Ollama
      - OLLAMA_URL=${OLLAMA_URL:-http://192.168.1.9:11434}
      - OLLAMA_MODEL=${OLLAMA_MODEL:-qwen2.5:7b}
      - GEM_API_KEYS=${GEM_API_KEYS}
      # Embeddings
      - JINA_API_KEY=${JINA_API_KEY}
      # Vector DB
      - QDRANT_CONTAINER_URL=${QDRANT_CONTAINER_URL}
      - QDRANT_API_KEY=${QDRANT_API_KEY}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3000/api/usage"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
